name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/securefl
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # 1. SAST, Dependency Audit & Secret Scanning (Hard Blocking Gates)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Gates (Bandit, Semgrep, pip-audit, Safety, detect-secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies & security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bandit SAST (Fail on High/Medium)
        run: |
          bandit -r backend federated_learning scripts \
            -f json -o bandit-report.json \
            --severity-level medium --confidence-level medium

      - name: Semgrep SAST
        run: |
          semgrep --config=p/python --config=p/owasp-top-ten \
            --error --json --output=semgrep-report.json \
            backend federated_learning

      - name: Dependency Vulnerability Scan (pip-audit & safety)
        run: |
          pip-audit -r requirements.txt --strict --format json -o pip-audit-report.json
          safety check -r requirements.txt --full-report

      - name: Secret Detection (detect-secrets)
        run: |
          detect-secrets scan \
            --exclude-files '(^\.git/|^data/|^metrics/|^\.env\.example$|^tests/)' \
            > .secrets.scan.json
          python - <<'EOF'
          import json, sys
          data = json.load(open(".secrets.scan.json"))
          results = {k: v for k, v in data.get("results", {}).items() if v}
          if results:
              print("FAIL: Potential secrets detected:", json.dumps(results, indent=2))
              sys.exit(1)
          print("PASS: Zero hardcoded secrets detected.")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            semgrep-report.json
            pip-audit-report.json

  # ---------------------------------------------------------------------------
  # 2. Lint, Type Safety & Automated Test Suite (>= 80% Coverage Gate)
  # ---------------------------------------------------------------------------
  test-and-coverage:
    name: Lint & Pytest (>=80% Coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Flake8 Lint Check
        run: |
          flake8 backend federated_learning tests --max-line-length=130 --count --statistics

      - name: Run Pytest with >=80% Coverage Gate
        env:
          ENVIRONMENT: test
          FIREBASE_ENABLED: "false"
        run: |
          pytest tests/ \
            --cov=backend \
            --cov=federated_learning \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v --tb=short

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # 3. Container Build, Trivy Scan, Syft SBOM & Cosign Signing
  # ---------------------------------------------------------------------------
  container-supply-chain:
    name: Container Trivy Scan, SBOM (Syft) & Signing (Cosign)
    runs-on: ubuntu-latest
    needs: [security-scan, test-and-coverage]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Production Images
        run: |
          docker build -f backend/Dockerfile --target production -t securefl-api:scan .
          docker build -f federated_learning/Dockerfile --target production -t securefl-fl:scan .
          docker build -f frontend/Dockerfile -t securefl-frontend:scan ./frontend

      - name: Trivy Scan — API Gateway (Block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: securefl-api:scan
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy Scan — FL Server (Block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: securefl-fl:scan
          format: sarif
          output: trivy-fl.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy Scan — Frontend & Filesystem IaC
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate CycloneDX SBOM via Syft
        uses: anchore/sbom-action@v0.17.2
        with:
          image: securefl-api:scan
          format: cyclonedx-json
          output-file: sbom-api.cyclonedx.json

      - name: Install Cosign for Artifact/Image Signing
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign SBOM Attestation Blob (Keyless on Tag/Main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cosign sign-blob --yes --output-signature sbom-api.sig --output-certificate sbom-api.pem sbom-api.cyclonedx.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-artifacts
          path: |
            trivy-*.sarif
            sbom-api.cyclonedx.json

  # ---------------------------------------------------------------------------
  # 4. Firebase Hosting & Security Rules Check (Non-Destructive Validation)
  # ---------------------------------------------------------------------------
  firebase-rules-check:
    name: Firebase Rules & Hosting Config Validation
    runs-on: ubuntu-latest
    needs: [test-and-coverage]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Test SDK & Validate Rules Syntax
        run: |
          npm install -g firebase-tools
          npm install --no-save @firebase/rules-unit-testing firebase
          firebase emulators:exec --project securefl-ci --only firestore,storage "node tests/firebase_rules.test.mjs"
