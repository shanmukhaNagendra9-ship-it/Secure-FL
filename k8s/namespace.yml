---
# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes Namespace: multi-tenant-fl
# Isolates all resources of the multi-tenant federated learning platform
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: multi-tenant-fl
  labels:
    app.kubernetes.io/name: multi-tenant-fl
    app.kubernetes.io/managed-by: kubectl
    environment: production
    security-tier: restricted
  annotations:
    description: "Multi-Tenant Cloud Data Isolation via Federated Learning for Cross-Tenant Threat Detection"
    owner: "platform-team"
    contact: "platform@example.com"

---
# Resource Quota: enforce fair resource usage within the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: multi-tenant-fl-quota
  namespace: multi-tenant-fl
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    services: "20"
    persistentvolumeclaims: "10"
    secrets: "50"
    configmaps: "50"

---
# LimitRange: default resource requests/limits for containers in the namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: multi-tenant-fl-limits
  namespace: multi-tenant-fl
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
